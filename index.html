<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おうちラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: 手づくりの道具棚。タイルは「ラベルを貼った引き出し」。左に教科色のアイコン、右に名前と説明 */
:root{
  --bg:#edf3f0; --dot:#d5e2dc; --card:#ffffff; --ink:#1e3631; --muted:#5b726c; --line:#c3d3cc;
  --geo:#2f8a5f; --geo-soft:#dcefe4;
  --math:#2f6bd8; --math-soft:#dce6fa;
  --music:#c0508a; --music-soft:#f6e0ec;
  --code:#d9730d; --code-soft:#fde7cf;
  --ready:#8a9a95;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131c1a; --dot:#1e2a27; --card:#1a2523; --ink:#e4efeb; --muted:#9db1ab; --line:#33443f;
  --geo:#5cc493; --geo-soft:#1f3a2e; --math:#7aa3f2; --math-soft:#21314f; --music:#e489b8; --music-soft:#3d2333; --code:#f0a050; --code-soft:#3d2b1a;
  --ready:#6f807b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131c1a; --dot:#1e2a27; --card:#1a2523; --ink:#e4efeb; --muted:#9db1ab; --line:#33443f;
  --geo:#5cc493; --geo-soft:#1f3a2e; --math:#7aa3f2; --math-soft:#21314f; --music:#e489b8; --music-soft:#3d2333; --code:#f0a050; --code-soft:#3d2b1a;
  --ready:#6f807b; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.7;
}
.wrap{max-width:880px;margin:0 auto;padding-block:40px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}

header{display:flex;flex-direction:column;gap:4px}
h1{margin:0;font-family:var(--pop);font-weight:400;font-size:clamp(2.4rem,8vw,3.6rem);line-height:1.15;letter-spacing:.04em;text-wrap:balance}
h1 .flask{display:inline-block;width:.8em;height:.8em;vertical-align:-.04em;margin-left:.12em;color:var(--geo)}
.lead{margin:0;color:var(--muted);font-size:1rem}

.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;list-style:none;margin:0;padding:0}
@media (max-width:620px){.shelf{grid-template-columns:1fr}}

.tile{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;align-items:center;height:100%;
  padding:16px;border-radius:20px;background:var(--card);border:2px solid var(--line);
  color:inherit;text-decoration:none;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
a.tile:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 6px 0 var(--c-soft)}
a.tile:active{transform:translateY(0)}
a.tile:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.icon{width:84px;height:84px;border-radius:18px;background:var(--c-soft);color:var(--c);display:grid;place-items:center}
.icon svg{width:52px;height:52px}
.body{display:flex;flex-direction:column;gap:4px;min-width:0}
.name{font-family:var(--pop);font-weight:400;font-size:1.3rem;line-height:1.3}
.desc{margin:0;color:var(--muted);font-size:.92rem;line-height:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.74rem;font-weight:700;letter-spacing:.08em;padding:1px 9px;border-radius:999px;background:var(--c-soft);color:var(--c)}
.chip.wait{background:transparent;border:1.5px dashed var(--ready);color:var(--ready)}

.geo{--c:var(--geo);--c-soft:var(--geo-soft)}
.math{--c:var(--math);--c-soft:var(--math-soft)}
.music{--c:var(--music);--c-soft:var(--music-soft)}
.code{--c:var(--code);--c-soft:var(--code-soft)}
.tile.soon{border-style:dashed;cursor:default}
.tile.soon .icon{filter:grayscale(.6);opacity:.7}

footer{color:var(--muted);font-size:.82rem;border-top:1px dashed var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}a.tile:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>おうちラボ<svg class="flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg></h1>
    <p class="lead">うちでつくった、まなびの道具。さわって、うごかして、たしかめよう。</p>
  </header>

  <!-- アプリを足すときは <li> を1つコピーして、名前・説明・URL・色（geo / math / music / code）を書きかえる。
       まだ公開していないものは <a> を <div> にして class に soon を足し、chip を「じゅんびちゅう」にする -->
  <ul class="shelf">
    <li class="geo">
      <a class="tile" href="https://chizu-lab.vercel.app/">
        <span class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 12l11-5 14 5 11-5v29l-11 5-14-5-11 5z"/><path d="M17 7v29M31 12v29"/><circle cx="24" cy="22" r="3" fill="currentColor" stroke="none"/></svg></span>
        <span class="body">
          <span class="chips"><span class="chip">しゃかい</span></span>
          <span class="name">地図ラボ</span>
          <span class="desc">日本地図で、山・川・とくさん品・世界遺産をおぼえる</span>
        </span>
      </a>
    </li>
    <li class="math">
      <a class="tile" href="https://tenkaizu-lab.vercel.app/">
        <span class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M18 4h12v10H18zM6 14h36v10H6zM18 24h12v10H18zM18 34h12v10H18z"/><path d="M18 14v10M30 14v10"/></svg></span>
        <span class="body">
          <span class="chips"><span class="chip">さんすう</span></span>
          <span class="name">展開図ラボ</span>
          <span class="desc">展開図を3Dでおりたたんで、どの立体になるかたしかめる</span>
        </span>
      </a>
    </li>
    <li class="math">
      <a class="tile" href="https://bunsu-lab.vercel.app/">
        <span class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="12" width="38" height="10" rx="1"/><path d="M14.5 12v10M24 12v10M33.5 12v10"/><path d="M5 12h19v10H5z" fill="currentColor"/><path d="M14 32h20M24 27v0M24 37v0" stroke-linecap="round"/><circle cx="24" cy="28" r="1.8" fill="currentColor" stroke="none"/><circle cx="24" cy="36" r="1.8" fill="currentColor" stroke="none"/></svg></span>
        <span class="body">
          <span class="chips"><span class="chip">さんすう</span></span>
          <span class="name">分数・小数ラボ</span>
          <span class="desc">分数・小数の たし算〜わり算を、図でうごかしてわかる</span>
        </span>
      </a>
    </li>
    <li class="music">
      <a class="tile" href="https://onpudrill.vercel.app/">
        <span class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 14h40M4 20h40M4 26h40M4 32h40M4 38h40" stroke-width="1.4" opacity=".55"/><ellipse cx="18" cy="35" rx="5" ry="3.6" transform="rotate(-20 18 35)" fill="currentColor" stroke="none"/><path d="M22.6 33.5V9l9 4"/></svg></span>
        <span class="body">
          <span class="chips"><span class="chip">おんがく</span></span>
          <span class="name">おんぷよみドリル</span>
          <span class="desc">五線譜の音符を読んで、ピアノでひく練習</span>
        </span>
      </a>
    </li>
    <li class="code">
      <a class="tile" href="https://code-lab-beige.vercel.app/">
        <span class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 10h12l2 3h8l2-3h12v10H6z"/><path d="M6 20h7v18H6z"/><path d="M6 38h20l2 3h4l2-3h8"/><path d="M13 25h10l2 3h8l2-3h7v8H13z" fill="currentColor"/></svg></span>
        <span class="body">
          <span class="chips"><span class="chip">プログラミング</span></span>
          <span class="name">ピコのコード島</span>
          <span class="desc">ブロックをならべてロボットを動かす。Scratchのまえのれんしゅう</span>
        </span>
      </a>
    </li>
  </ul>

  <footer>手づくりの学習ツール集。気づいたことや「こんなのほしい」は、つくった人へ。</footer>
</div>
</body>
</html>
